# AirHouse — Nginx server block for airhouse.co.za
#
# Drop in at /etc/nginx/sites-available/airhouse.co.za.conf and symlink into
# sites-enabled. This file assumes Nginx is already running other sites on
# this host and does not change anything global.
#
#   sudo cp deploy/nginx/airhouse.co.za.conf /etc/nginx/sites-available/
#   sudo ln -sfn /etc/nginx/sites-available/airhouse.co.za.conf \
#                /etc/nginx/sites-enabled/airhouse.co.za.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# KEEP THE .conf SUFFIX. Debian's stock nginx.conf includes
# `sites-enabled/*`, but plenty of hosts -- including ones set up by a panel
# or a provider image -- include `sites-enabled/*.conf` instead. A file named
# `airhouse.co.za` is then silently ignored: `nginx -t` passes, the symlink
# looks right, and the site simply does not exist. Worse, certbot then cannot
# find a vhost for the name and will edit somebody else's file instead.
# `.conf` is matched by both globs, so it is always the safe choice.
#
# Prove Nginx has actually loaded this file, rather than trusting the symlink:
#
#   sudo nginx -T | grep -c airhouse_app     # expect 1 or more, never 0
#
# CERTIFICATE -- use certonly, NOT `certbot --nginx`.
#
# The 443 blocks below already name the paths certbot writes, so certbot's
# nginx *installer* has nothing to add. Running `certbot --nginx` on a host
# that already serves other sites invites it to pick a different server block
# -- the catch-all in default.conf, say -- and rewrite that site's TLS
# configuration instead. On a box using HTTP/3 that produces
#
#   nginx: [emerg] no "ssl_certificate" is defined for the "listen ... quic"
#                  directive in /etc/nginx/sites-enabled/default.conf:34
#
# and then nginx will not start at all: every site on the host, not just this
# one. `certonly` only writes to /etc/letsencrypt and never touches an nginx
# file.
#
# Order matters, because nginx will not start pointed at a certificate that is
# not there yet:
#
#   1. Comment out both 443 blocks below, leaving only the port 80 block.
#   2. sudo nginx -t && sudo systemctl reload nginx
#   3. sudo certbot certonly --webroot -w /var/www/html \
#        -d airhouse.co.za -d www.airhouse.co.za \
#        --deploy-hook "systemctl reload nginx"
#   4. Uncomment the 443 blocks.
#   5. sudo nginx -t && sudo systemctl reload nginx
#
# The deploy hook is what reloads nginx when the certificate renews in sixty
# days. Without it the renewal succeeds and nginx keeps serving the expired
# certificate until something else restarts it.

# Rate limit zone for the public lead endpoint. Defined here but only applied
# to the one location that needs it. The application enforces its own limits
# as well; this is the cheaper outer layer that never reaches Node.
limit_req_zone $binary_remote_addr zone=airhouse_leads:10m rate=10r/m;

upstream airhouse_app {
    # Must match APP_PORT in deploy/.env.production.
    server 127.0.0.1:5000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name airhouse.co.za www.airhouse.co.za;

    # Leave this reachable over HTTP so certificates can renew.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://airhouse.co.za$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.airhouse.co.za;

    ssl_certificate     /etc/letsencrypt/live/airhouse.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/airhouse.co.za/privkey.pem;

    # One canonical host, so links, cookies and the Supabase redirect URL all
    # agree on where the site lives.
    return 301 https://airhouse.co.za$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name airhouse.co.za;

    ssl_certificate     /etc/letsencrypt/live/airhouse.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/airhouse.co.za/privkey.pem;

    # If certbot has already written these on this host, it includes them
    # itself and you can drop these two lines.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    access_log /var/log/nginx/airhouse.access.log;
    error_log  /var/log/nginx/airhouse.error.log;

    # ---- Security headers -------------------------------------------------
    # HSTS is deliberately commented out. Turn it on only once you are
    # certain the site will stay on HTTPS, because browsers remember it and
    # it is painful to undo.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

    # The app talks to Supabase and, when configured, Sentry. Widen this only
    # as far as you actually need.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.ingest.sentry.io; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # Payload cap. The API itself refuses anything over 64kb; this stops a
    # large body reaching Node at all. Raise it only if you start accepting
    # uploads through the app rather than straight to Supabase Storage.
    client_max_body_size 2m;

    # ---- Static assets ----------------------------------------------------
    # Vite fingerprints filenames, so these can be cached hard and for a long
    # time. index.html must not be, or browsers keep an old bundle.
    location /assets/ {
        proxy_pass http://airhouse_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Express's static middleware already sends `Cache-Control: public,
        # max-age=0`, and nginx's add_header ADDS rather than replaces -- so
        # the response carried two Cache-Control headers and the upstream's
        # max-age=0 is the one that took effect. Every visitor re-downloaded
        # the whole bundle on every page load, which is precisely what
        # fingerprinted filenames exist to avoid. Drop the upstream's header
        # first, then set ours.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ---- Public lead endpoint --------------------------------------------
    # The one route an unauthenticated stranger can POST to.
    location = /api/notifications/lead {
        limit_req zone=airhouse_leads burst=5 nodelay;

        proxy_pass http://airhouse_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    # ---- Everything else --------------------------------------------------
    location / {
        proxy_pass http://airhouse_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # index.html is never cached, so a deploy is picked up immediately.
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # Health endpoint, for uptime monitoring. Kept out of the access log so it
    # does not drown the real traffic.
    location = /api/health {
        access_log off;
        proxy_pass http://airhouse_app;
        proxy_set_header Host $host;
    }
}
